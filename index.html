<div id="v"></div><div id="g"></div>
<div id="s"><h1>Pocket Planes <b>Expedition</b></h1><div>v0.5 Tech Demo · Click to take off · sound on</div>

<script>window.addEventListener('error',e=>{if(window.__galNoWebGL)return;const s=document.getElementById('s');if(s)s.innerHTML='<h1>ERR</h1><pre style="white-space:pre-wrap;font-size:11px;color:#f66">'+(e.message||e.error)+'\n'+(e.filename||'')+':'+(e.lineno||'')+'</pre>'});window.addEventListener('unhandledrejection',e=>{const s=document.getElementById('s');if(s)s.innerHTML='<h1>REJ</h1><pre style="white-space:pre-wrap;font-size:11px;color:#f66">'+(e.reason&&e.reason.stack||e.reason)+'</pre>'});</script>
